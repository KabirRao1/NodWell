name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon; Intel Mac is unsupported (DECISIONS.md D2).
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # also on Windows, so the annotate helper script runs everywhere
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: bash .github/scripts/run-and-annotate.sh "Mypy" uv run mypy

      - name: Pytest
        run: bash .github/scripts/run-and-annotate.sh "Pytest" uv run pytest
